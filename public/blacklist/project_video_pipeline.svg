<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e05" />
      <stop offset="50%" stop-color="#0c0702" />
      <stop offset="100%" stop-color="#040201" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7700" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff3300" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 119, 0, 0.08)" />
      <stop offset="100%" stop-color="rgba(25, 14, 5, 0.7)" />
    </linearGradient>
    <pattern id="gridPattern3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 119, 0, 0.08)" stroke-width="1" />
    </pattern>
    <filter id="glowOrange">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad3)" />
  <rect width="600" height="340" fill="url(#gridPattern3)" />

  <!-- Accent lines -->
  <path d="M-20 70 L160 -20 M500 360 L620 240" stroke="rgba(255,119,0,0.18)" stroke-width="2" />

  <!-- Top Header Bar -->
  <rect x="24" y="20" width="552" height="38" fill="rgba(15,8,3,0.9)" stroke="#ff7700" stroke-width="1.5" />
  <path d="M24 20 L40 20 L32 58 L24 58 Z" fill="#ff7700" />
  <text x="50" y="44" font-family="'Orbitron', 'Impact', sans-serif" font-size="13" font-weight="700" fill="#ff7700" letter-spacing="2">// BLACKLIST #03 : AWS EVENT-DRIVEN VIDEO TRANSCODER</text>
  <rect x="430" y="28" width="134" height="22" fill="#ffd700" rx="2" />
  <text x="497" y="43" font-family="monospace" font-size="10" font-weight="700" fill="#000" text-anchor="middle">ADAPTIVE HLS LADDER</text>

  <!-- Transcoding Pipeline Flow -->
  <rect x="24" y="70" width="360" height="246" fill="url(#cardGrad3)" stroke="rgba(255,119,0,0.3)" stroke-width="1.5" />
  <text x="40" y="96" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700" fill="#ffd700" letter-spacing="1.5">SERVERLESS FAN-OUT ARCHITECTURE</text>

  <!-- Step 1: S3 Upload -->
  <g transform="translate(40, 114)">
    <rect width="88" height="52" fill="#201006" stroke="#ff7700" stroke-width="1.5" rx="3" />
    <text x="44" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffd700" text-anchor="middle">AWS S3 BUCKET</text>
    <text x="44" y="36" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">4K/1080p Master</text>
    <text x="44" y="46" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">Event Trigger</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M128 140 L160 140" stroke="#ff7700" stroke-width="2" stroke-dasharray="3 2" />
  <polygon points="160,140 154,136 154,144" fill="#ff7700" />

  <!-- Step 2: Lambda Cluster -->
  <g transform="translate(162, 114)">
    <rect width="102" height="52" fill="#2d1305" stroke="#ffd700" stroke-width="1.5" rx="3" />
    <text x="51" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#ff9900" text-anchor="middle">AWS LAMBDA</text>
    <text x="51" y="36" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">FFMPEG Engine</text>
    <text x="51" y="46" font-family="monospace" font-size="7" fill="#ffd700" text-anchor="middle">Async Concurrent</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M264 140 L294 140" stroke="#ff7700" stroke-width="2" stroke-dasharray="3 2" />
  <polygon points="294,140 288,136 288,144" fill="#ff7700" />

  <!-- Step 3: HLS Stream -->
  <g transform="translate(296, 114)">
    <rect width="76" height="52" fill="#201006" stroke="#00e5ff" stroke-width="1.5" rx="3" />
    <text x="38" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#00e5ff" text-anchor="middle">HLS STREAMS</text>
    <text x="38" y="36" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">1080p, 720p</text>
    <text x="38" y="46" font-family="monospace" font-size="8" fill="#ffd700" text-anchor="middle">480p Ladder</text>
  </g>

  <!-- Bitrate Spectrum Visualizer -->
  <g transform="translate(40, 182)">
    <rect width="332" height="58" fill="#120903" stroke="rgba(255,119,0,0.4)" stroke-width="1" />
    <text x="14" y="18" font-family="monospace" font-size="8" font-weight="700" fill="#ffd700">ADAPTIVE BITRATE LADDER TELEMETRY</text>

    <!-- 1080p bar -->
    <rect x="14" y="26" width="304" height="6" fill="#1a0d05" />
    <rect x="14" y="26" width="290" height="6" fill="#00e5ff" />
    <text x="14" y="42" font-family="monospace" font-size="7" fill="#aaa">1080p @ 6000 kbps (HD Master)</text>

    <!-- 720p bar -->
    <rect x="14" y="46" width="304" height="6" fill="#1a0d05" />
    <rect x="14" y="46" width="210" height="6" fill="#ffd700" />
  </g>

  <!-- Bottom Metric Box -->
  <rect x="40" y="252" width="332" height="50" fill="#0e0702" stroke="rgba(255,215,0,0.4)" stroke-width="1" />
  <text x="54" y="272" font-family="sans-serif" font-size="8" font-weight="700" fill="#aaa">SERVER COST SAVINGS</text>
  <text x="54" y="290" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#ffd700">ZERO IDLE COMPUTE</text>
  <text x="210" y="272" font-family="sans-serif" font-size="8" font-weight="700" fill="#aaa">PLAYBACK SMOOTHNESS</text>
  <text x="210" y="290" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#ff7700">100% BUFFER-FREE</text>

  <!-- Right: Speed Gauge & Cloud Stats -->
  <rect x="396" y="70" width="180" height="246" fill="url(#cardGrad3)" stroke="rgba(255,119,0,0.3)" stroke-width="1.5" />
  <text x="412" y="96" font-family="'Orbitron', sans-serif" font-size="11" font-weight="700" fill="#ff7700" letter-spacing="1">CLOUD STACK</text>

  <!-- Dial / Wave -->
  <g transform="translate(486, 155)">
    <circle r="40" fill="none" stroke="rgba(255,119,0,0.2)" stroke-width="3" />
    <path d="M -30 20 A 40 40 0 1 1 30 20" fill="none" stroke="url(#fireGrad)" stroke-width="4" filter="url(#glowOrange)" />
    <line x1="0" y1="0" x2="20" y2="-22" stroke="#fff" stroke-width="2" />
    <circle r="4" fill="#ffd700" />
    <text x="0" y="28" font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" fill="#ffd700" text-anchor="middle">ASYNCHRONOUS</text>
  </g>

  <!-- Chips on right -->
  <g transform="translate(412, 226)">
    <rect x="0" y="0" width="70" height="22" fill="#201006" stroke="#ff7700" stroke-width="1" />
    <text x="35" y="15" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">AWS S3</text>

    <rect x="78" y="0" width="70" height="22" fill="#201006" stroke="#ffd700" stroke-width="1" />
    <text x="113" y="15" font-family="sans-serif" font-size="8" font-weight="700" fill="#ffd700" text-anchor="middle">AWS Lambda</text>

    <rect x="0" y="28" width="70" height="22" fill="#201006" stroke="#00e5ff" stroke-width="1" />
    <text x="35" y="43" font-family="sans-serif" font-size="8" font-weight="700" fill="#00e5ff" text-anchor="middle">HLS Video</text>

    <rect x="78" y="28" width="70" height="22" fill="#201006" stroke="#ff7700" stroke-width="1" />
    <text x="113" y="43" font-family="sans-serif" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Node.js</text>
  </g>
</svg>
